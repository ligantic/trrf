name: trrf

volumes:
  dev_db_data:
  dev_clinicaldb_data:
  smtp4dev_data:

services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:3.12
    command: sleep infinity
    volumes:
      - "${HOST_WORKSPACE_FOLDER:-..}:/workspaces/rdrf"
    working_dir: /workspaces/rdrf/rdrf
    depends_on:
      - db
      - clinicaldb

  db:
    image: "postgres:${POSTGRES_VERSION}"
    env_file:
      - docker/dev/envs/postgres
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    ports:
      - "5432"

  clinicaldb:
    image: "postgres:${POSTGRES_VERSION}"
    env_file:
      - docker/dev/envs/postgres
    volumes:
      - dev_clinicaldb_data:/var/lib/postgresql/data
    ports:
      - "5432"

  smtp4dev:
    image: rnwood/smtp4dev:v3
    environment:
      ServerOptions__Urls: http://*:80
      ServerOptions__HostName: smtp4dev
    volumes:
      - smtp4dev_data:/smtp4dev
    ports:
      - "${SMTP4DEV_WEB_PORT:-15000}:80"
      - "${SMTP4DEV_SMTP_PORT:-12525}:25"
      - "${SMTP4DEV_IMAP_PORT:-13143}:143"

  runserver:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    image: ${TRRF_IMAGE_NAME}
    env_file:
      - docker/dev/envs/postgres
      - docker/dev/envs/runserver
      - .env_local
    restart: on-failure
    volumes:
      - .:/app
      - ./data/dev/:/data
    ports:
      - "${TRRF_HOST_PORT:-8000}:8000"
    depends_on:
      - db
      - clinicaldb
      - smtp4dev
      # - xray-daemon

  longitudinal-followup-lambda:
    image: ${TRRF_IMAGE_NAME}
    env_file:
      - docker/dev/envs/postgres
      - docker/dev/envs/runserver
      - .env_local
    volumes:
      - .:/app
      - ./data/dev/:/data
    ports:
      - "8001:8080"
    depends_on:
      - db
      - clinicaldb
      - smtp4dev
      # - xray-daemon
    working_dir: /app
    command:
      - lambda_local
      - lambda.longitudinal_followup_handler

  # xray-daemon:
  #   image: amazon/aws-xray-daemon:3.2.0
  #   ports:
  #     - "2000"
  #     - "2000/udp"
  #   env_file:
  #     - .env_local
  #   command: ["-o", "--bind", "0.0.0.0:2000"]
