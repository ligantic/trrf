{% load show_banner %}
{% load i18n %}
{% show_banner as SHOW_BANNER %}
{% banner_text as BANNER_TEXT %}

{% if SHOW_BANNER %}
<div class="alert alert-warning mb-0 text-center" role="alert">
  <span class="fa fa-exclamation-circle" aria-hidden="true"></span>
  {% trans "This registry is for testing purposes only. Do not submit real patient data." %}
</div>
{% endif %}
{% if BANNER_TEXT %}
<div class="alert alert-info mb-0 text-center" role="alert">
  <span class="fa fa-info-circle" aria-hidden="true"></span>
  {% trans BANNER_TEXT|safe %}
</div>
{% endif %}
