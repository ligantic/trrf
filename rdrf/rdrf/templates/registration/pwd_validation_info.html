<script>
    $(function () {
        const $trigger = $("#validation-info");
        const $help = $("#pwd-help");

        $trigger.attr({
            "aria-controls": "pwd-help",
            "aria-expanded": "false",
            role: "button",
            tabindex: 0
        });

        function togglePasswordHelp() {
            const isVisible = $help.is(":visible");
            $help.toggle(!isVisible);
            $trigger.attr("aria-expanded", String(!isVisible));
        }

        $trigger.on("click", togglePasswordHelp);
        $trigger.on("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                togglePasswordHelp();
            }
        });
    });
</script>
